<!DOCTYPE html>

<style>
        .pixel-bg {
            background-image: 
                linear-gradient(45deg, #fcf9f8 25%, transparent 25%, transparent 75%, #fcf9f8 75%, #fcf9f8),
                linear-gradient(45deg, #fcf9f8 25%, transparent 25%, transparent 75%, #fcf9f8 75%, #fcf9f8);
            background-color: #f6f3f2;
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        .pixel-border {
            box-shadow: 
                -4px 0 0 0 #570000,
                4px 0 0 0 #570000,
                0 -4px 0 0 #570000,
                0 4px 0 0 #570000;
            border-radius: 0;
            margin: 4px;
        }
        .btn-press:active {
            transform: translateY(2px);
            box-shadow: none !important;
        }
    </style>
</head>
<body class="bg-surface pixel-bg min-h-screen flex items-center justify-center font-body-md text-on-surface p-4">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface-container-lowest pixel-border p-8 relative z-10">
<!-- Decorative Corners -->
<div class="absolute -top-3 -left-3 w-6 h-6 bg-xp-fill border-2 border-primary z-20"></div>
<div class="absolute -top-3 -right-3 w-6 h-6 bg-xp-fill border-2 border-primary z-20"></div>
<div class="absolute -bottom-3 -left-3 w-6 h-6 bg-xp-fill border-2 border-primary z-20"></div>
<div class="absolute -bottom-3 -right-3 w-6 h-6 bg-xp-fill border-2 border-primary z-20"></div>
<!-- Header -->
<header class="text-center mb-8">
<h1 class="font-[Fredoka] text-[48px] font-bold text-primary tracking-tight leading-tight mb-2">
                GAITS
            </h1>
<p class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-widest flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px] text-xp-fill" style="font-variation-settings: 'FILL' 1;">swords</span>
                Begin your quest
                <span class="material-symbols-outlined text-[16px] text-xp-fill" style="font-variation-settings: 'FILL' 1;">swords</span>
</p>
</header>
<!-- Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border-2 border-outline-variant rounded-[10px] focus:outline-none focus:border-primary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface placeholder:text-text-secondary" id="email" placeholder="scholar@gaits.edu" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot Scroll?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border-2 border-outline-variant rounded-[10px] focus:outline-none focus:border-primary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface placeholder:text-text-secondary" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-[10px] shadow-[0_4px_0_0_#410000] btn-press transition-transform flex items-center justify-center gap-2 mt-4 hover:bg-primary-container" type="submit">
                Enter Realm
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
</button>
<!-- Divider -->
<div class="relative flex py-4 items-center">
<div class="flex-grow border-t-2 border-dashed border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-label-bold text-label-bold text-on-surface-variant">OR</span>
<div class="flex-grow border-t-2 border-dashed border-outline-variant"></div>
</div>
<!-- Secondary Action -->
<button class="w-full bg-secondary-container text-on-secondary-container font-headline-md text-headline-md py-4 rounded-[10px] shadow-[0_4px_0_0_#544600] btn-press transition-transform flex items-center justify-center gap-2 hover:brightness-105" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">school</span>
                Campus SSO
            </button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant mt-6">
                New to the academy? <a class="text-primary font-bold hover:underline" href="#">Enlist here</a>
</p>
</form>
</main>
<!-- Floating Atmosphere Elements -->
<div class="fixed top-20 left-20 opacity-20 pointer-events-none animate-bounce" style="animation-duration: 4s;">
<span class="material-symbols-outlined text-[64px] text-primary">book</span>
</div>
<div class="fixed bottom-20 right-20 opacity-20 pointer-events-none animate-bounce" style="animation-duration: 5s; animation-delay: 1s;">
<span class="material-symbols-outlined text-[64px] text-xp-fill" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</body></html>
