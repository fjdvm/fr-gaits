<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Signup - GAITS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-container": "#0021b9",
                        "on-surface": "#1c1b1b",
                        "inverse-primary": "#ffb4a8",
                        "on-secondary-container": "#6e5c00",
                        "on-primary-container": "#ff8371",
                        "on-tertiary-fixed": "#000c61",
                        "outline": "#8e706c",
                        "xp-fill": "#FFD700",
                        "on-secondary-fixed-variant": "#544600",
                        "status-warning": "#FFBF00",
                        "surface-dim": "#dcd9d9",
                        "secondary-fixed": "#ffe16d",
                        "primary-fixed-dim": "#ffb4a8",
                        "on-error-container": "#93000a",
                        "outline-variant": "#e2bfb9",
                        "on-tertiary-fixed-variant": "#1830c2",
                        "status-heart": "#FF3131",
                        "secondary": "#705d00",
                        "on-primary-fixed": "#410000",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#800000",
                        "background": "#fcf9f8",
                        "primary-fixed": "#ffdad4",
                        "surface-container-highest": "#e5e2e1",
                        "surface-tint": "#b22b1d",
                        "error-container": "#ffdad6",
                        "surface-container": "#f0eded",
                        "on-background": "#1c1b1b",
                        "on-secondary": "#ffffff",
                        "text-secondary": "#708090",
                        "on-surface-variant": "#5a413d",
                        "secondary-container": "#fcd400",
                        "tertiary-fixed-dim": "#bcc2ff",
                        "on-primary-fixed-variant": "#8f0f07",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f3f0ef",
                        "on-secondary-fixed": "#221b00",
                        "on-tertiary-container": "#94a0ff",
                        "streak-flame": "#FF4500",
                        "on-error": "#ffffff",
                        "surface-bright": "#fcf9f8",
                        "surface-variant": "#e5e2e1",
                        "surface-container-high": "#eae7e7",
                        "status-success": "#28A745",
                        "surface-alt": "#F8F9FA",
                        "surface": "#fcf9f8",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f6f3f2",
                        "inverse-surface": "#313030",
                        "primary": "#570000",
                        "on-primary": "#ffffff",
                        "tertiary": "#00137f",
                        "tertiary-fixed": "#dfe0ff",
                        "secondary-fixed-dim": "#e9c400"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        gutter: "24px",
                        "container-max": "1280px",
                        "margin-desktop": "40px",
                        unit: "4px",
                        "margin-mobile": "16px"
                    },
                    fontFamily: {
                        "headline-lg": ["Fredoka"],
                        "headline-lg-mobile": ["Fredoka"],
                        "label-sm": ["Fredoka"],
                        "body-md": ["Fredoka"],
                        "body-lg": ["Fredoka"],
                        "display-hero": ["Fredoka"],
                        "headline-md": ["Fredoka"],
                        "label-bold": ["Fredoka"]
                    },
                    fontSize: {
                        "headline-lg": ["32px", { lineHeight: "1.2", fontWeight: "700" }],
                        "headline-lg-mobile": ["28px", { lineHeight: "1.2", fontWeight: "700" }],
                        "label-sm": ["12px", { lineHeight: "1.0", fontWeight: "500" }],
                        "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                        "display-hero": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
                        "label-bold": ["14px", { lineHeight: "1.0", letterSpacing: "0.05em", fontWeight: "700" }]
                    }
                }
            }
        };
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
        
        .btn-press:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 0 rgba(0,0,0,0) !important;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md overflow-hidden relative">
<!-- Decorative Background Elements -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary-container opacity-5 blur-[120px]"></div>
<div class="absolute top-[40%] -right-[10%] w-[50%] h-[50%] rounded-full bg-secondary-container opacity-5 blur-[100px]"></div>
</div>
<!-- Main Content Canvas -->
<div class="w-full max-w-[1000px] flex mx-margin-mobile md:mx-margin-desktop bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.06)] border border-surface-container overflow-hidden z-10 relative">
<!-- Left Side: Graphic / Branding (Hidden on mobile) -->
<div class="hidden md:flex flex-col w-1/2 bg-primary relative p-12 justify-between">
<div class="absolute inset-0 bg-[url('placeholder')] bg-cover bg-center mix-blend-overlay opacity-20" data-alt="A grand, slightly abstract architectural rendering of a futuristic university campus library. The scene features towering shelves of glowing, digital tomes and grand archways. The lighting is dramatic, with beams of warm sunlight piercing through large clerestory windows, casting long, geometric shadows. The overall aesthetic is 'The Scholar-Hero' - epic, intellectual, and inspiring, utilizing a color palette dominated by deep maroon and bright white light."></div>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-t from-primary via-primary/80 to-primary/40"></div>
<div class="relative z-10">
<h2 class="font-display-hero text-display-hero text-on-primary mb-2">GAITS</h2>
<p class="font-body-lg text-body-lg text-primary-fixed">Your Quest Awaits.</p>
</div>
<div class="relative z-10 mt-auto">
<div class="inline-block p-4 rounded-lg bg-white/10 backdrop-blur-md border border-white/20 shadow-lg">
<div class="flex items-center gap-3 mb-2">
<span class="material-symbols-outlined text-secondary-fixed filled-icon text-3xl">swords</span>
<h3 class="font-headline-md text-headline-md text-on-primary">Join the adventure</h3>
</div>
<p class="font-body-md text-body-md text-primary-fixed opacity-90">Unlock your scholar-hero potential. Master your subjects, climb the leaderboards, and claim your rewards.</p>
</div>
</div>
</div>
<!-- Right Side: Signup Form -->
<div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
<div class="md:hidden mb-8 text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">GAITS</h2>
</div>
<div class="mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Begin your journey today.</p>
</div>
<form class="space-y-6">
<!-- Role Selection Toggle -->
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-wider block">Choose Your Path</label>
<div class="flex p-1 bg-surface-container rounded-lg border border-outline-variant/30">
<button class="flex-1 py-2 px-4 rounded-md bg-surface-container-lowest shadow-sm border-2 border-primary text-primary font-label-bold text-label-bold transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-lg">school</span>
                            Student
                        </button>
<button class="flex-1 py-2 px-4 rounded-md text-on-surface-variant hover:text-on-surface font-label-bold text-label-bold transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-lg">local_library</span>
                            Instructor
                        </button>
</div>
</div>
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-wider block" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-2 border-surface-dim rounded-[10px] bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors" id="email" placeholder="scholar@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-wider block" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border-2 border-surface-dim rounded-[10px] bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Sign Up Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-[10px] font-label-bold text-label-bold uppercase tracking-wider shadow-[0_2px_0_rgba(0,0,0,0.2)] btn-press transition-all flex justify-center items-center gap-2 mt-4" type="submit">
                    Begin Quest
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="font-label-bold text-label-bold text-primary hover:underline underline-offset-4" href="#">Log In Here</a>
</p>
</div>
</div>
</div>
</body></html>
